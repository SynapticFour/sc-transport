name: Sc Transport Experimental Datagrams

on:
  push:
    branches:
      - main


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  datagram-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p sc-transport-datagrams --features quic-datagrams --test datagram_delivery_no_loss
      - run: cargo test -p sc-transport-datagrams --features quic-datagrams --test datagram_fallback_trigger
      - run: |
          mkdir -p artifacts
          echo "{\"status\":\"completed\",\"suite\":\"datagram-tests\"}" > artifacts/datagram-tests.json
      - uses: actions/upload-artifact@v7
        with:
          name: datagram-test-results
          path: artifacts/datagram-tests.json

  datagram-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo bench --features transport-datagrams --bench packet_loss -- --quick
      - run: |
          mkdir -p artifacts
          cargo run -p sct-bench -- synthetic --samples 5 --payload-mib 64 | tee artifacts/sct-bench.out
      - run: |
          mkdir -p artifacts
          THROUGHPUT="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("artifacts/sct-bench.out").read_text(encoding="utf-8")
          m = re.search(r"synthetic_throughput_mbps=([0-9.]+)", text)
          print(m.group(1) if m else "0")
          PY
          )"
          echo "{\"sct_synthetic_throughput_mbps\": ${THROUGHPUT}}" > artifacts/current-bench.json
      - uses: actions/cache@v5
        with:
          path: artifacts/previous-bench.json
          key: experimental-bench-${{ github.ref_name }}
          restore-keys: experimental-bench-
      - run: |
          if [ ! -f artifacts/previous-bench.json ]; then
            cp artifacts/current-bench.json artifacts/previous-bench.json
          fi
          python3 scripts/compare_bench_results.py artifacts/previous-bench.json artifacts/current-bench.json artifacts/regressions.txt
          cp artifacts/current-bench.json artifacts/previous-bench.json
      - name: Report benchmark regression (deduped)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f artifacts/regressions.txt ] && [ "$(cat artifacts/regressions.txt)" = "true" ]; then
            echo "::warning::Experimental datagram benchmark regression detected"
            TITLE="Experimental datagram benchmark regression detected"
            BODY="$(cat <<EOF
          The experimental packet-loss benchmark changed significantly.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Commit: ${{ github.sha }}

          See workflow artifacts for details.

          Policy: this workflow updates a single open tracking issue instead of filing a new issue on every regression.
          EOF
          )"
            EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number,title --jq "[.[] | select(.title==\"$TITLE\")] | first | .number // empty")"
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$BODY" \
                || echo "Could not comment on existing issue #$EXISTING; see workflow warning."
              echo "Updated existing issue #$EXISTING (no duplicate created)."
            else
              gh issue create --title "$TITLE" --body "$BODY" \
                || echo "Could not open GitHub issue (permissions or API); see workflow warning."
            fi
          else
            echo "No regression issue needed."
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: datagram-benchmark-results
          path: |
            artifacts/current-bench.json
            artifacts/regressions.txt
